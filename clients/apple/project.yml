name: HealthMonitorAI

options:
  bundleIdPrefix: com.young045
  deploymentTarget:
    iOS: "17.0"

packages:
  HealthMonitorCore:
    path: Packages/HealthMonitorCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  HealthMonitorAI:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: HealthMonitorCore
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.young045.healthmonitorai
        PRODUCT_NAME: HealthMonitorAI
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/HealthMonitorAI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  HealthMonitorAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: HealthMonitorAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.young045.healthmonitorai.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HealthMonitorAI:
    build:
      targets:
        HealthMonitorAI: all
        HealthMonitorAITests: [test]
    test:
      targets:
        - HealthMonitorAITests
    run:
      config: Debug
    archive:
      config: Release
