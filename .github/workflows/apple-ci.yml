name: Apple Package CI

on:
  push:
    branches: [main]
    paths:
      - "clients/apple/**"
      - "contracts/ai/**"
      - "data/manifests/**"
      - "tools/food-data/**"
      - ".github/workflows/apple-ci.yml"
  pull_request:
    paths:
      - "clients/apple/**"
      - "contracts/ai/**"
      - "data/manifests/**"
      - "tools/food-data/**"
      - ".github/workflows/apple-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Test food catalog pipeline
        run: python3 -m unittest discover -s tools/food-data/tests -v
      - name: Build and test HealthMonitorCore
        run: swift test --package-path clients/apple/Packages/HealthMonitorCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: clients/apple
        run: xcodegen generate
      - name: Build and test iPhone simulator app
        working-directory: clients/apple
        shell: bash
        run: |
          set -euo pipefail

          SIMULATOR_ID=$(
            xcrun simctl list devices available -j |
              /usr/bin/python3 -c '
          import json
          import sys

          runtimes = json.load(sys.stdin)["devices"]
          print(next(
              device["udid"]
              for devices in runtimes.values()
              for device in devices
              if device["name"].startswith("iPhone")
          ))
          '
          )

          xcodebuild \
            -project HealthMonitorAI.xcodeproj \
            -scheme HealthMonitorAI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            test
